<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Satsim | Interactive Satellite Constellation & ISL Visualizer</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
  <div id="canvas-container"></div>
  
  <div id="ui-panel">
    <div class="panel-header">
      <h2>Satsim Visualizer</h2>
      <p class="subtitle">3D Walker Constellation &amp; Real-time ISL Routing</p>
    </div>

    <div id="status-badge" class="badge">Initializing 3D Scene...</div>

    <div class="control-group">
      <h3>Constellation Parameters</h3>
      
      <div class="control-item">
        <label for="planes-slider">Orbital Planes: <span id="planes-val">6</span></label>
        <input type="range" id="planes-slider" min="2" max="24" value="6" step="1">
      </div>

      <div class="control-item">
        <label for="sats-slider">Satellites per Plane: <span id="sats-val">10</span></label>
        <input type="range" id="sats-slider" min="2" max="30" value="10" step="1">
      </div>

      <div class="control-item">
        <label for="altitude-slider">Altitude (km): <span id="altitude-val">550</span></label>
        <input type="range" id="altitude-slider" min="300" max="2000" value="550" step="50">
      </div>

      <div class="control-item">
        <label for="inclination-slider">Inclination (°): <span id="inclination-val">53</span></label>
        <input type="range" id="inclination-slider" min="0" max="98" value="53" step="1">
      </div>
    </div>

    <div class="control-group">
      <h3>Routing &amp; Visualization</h3>

      <div class="control-item">
        <label for="algo-select">Routing Algorithm</label>
        <select id="algo-select">
          <option value="dijkstra">Dijkstra (Shortest Path)</option>
          <option value="greedy">Greedy Geographic</option>
          <option value="static">Static Grid</option>
        </select>
      </div>

      <div class="control-item checkbox-item">
        <label for="toggle-isls">Show ISL Links</label>
        <input type="checkbox" id="toggle-isls" checked>
      </div>

      <div class="control-item">
        <label for="speed-slider">Sim Speed: <span id="speed-val">1.0x</span></label>
        <input type="range" id="speed-slider" min="0" max="5" value="1" step="0.1">
      </div>
    </div>

    <div class="control-group metrics-group">
      <h3>Network Telemetry</h3>
      <div class="metric-row"><span>Total Satellites:</span> <strong id="metric-total-sats">60</strong></div>
      <div class="metric-row"><span>Active ISLs:</span> <strong id="metric-active-isls">120</strong></div>
      <div class="metric-row"><span>Path Latency:</span> <strong id="metric-latency">-- ms</strong></div>
    </div>
  </div>

  <script src="wasm/satsim.js"></script>
  <script src="main.js"></script>
</body>
</html>
